<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login — DoIt Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
	rel="stylesheet">
<style>
:root {
	--bg: #0b0f14;
	--card: #0f1720;
	--muted: #9ca3af;
	--text: #e5e7eb;
	--accent: linear-gradient(135deg, #14b8a6, #22d3ee);
}

* {
	box-sizing: border-box;
	font-family: 'Montserrat', sans-serif;
}

html, body {
	height: 100%;
	margin: 0;
	font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Arial,
		sans-serif;
	background: radial-gradient(1000px 400px at 80% -10%, rgba(20, 184, 166, 0.06),
		transparent), var(--bg);
	color: var(--text);
}

.container {
	max-width: 980px;
	margin: 0 auto;
	padding: 0 24px;
}

header {
	padding: 18px 0;
	display: flex;
	justify-content: space-between;
	align-items: center
}

.brand {
	display: flex;
	align-items: center;
	gap: 12px;
	font-weight: 700
}

.logo {
	width: 36px;
	height: 36px;
	border-radius: 10px;
	display: grid;
	place-items: center;
	background: linear-gradient(135deg, #14b8a6, #22d3ee);
	color: #071014;
	font-weight: 800
}

.nav-actions a {
	color: var(--text);
	text-decoration: none;
	margin-left: 12px;
	padding: 8px 12px;
	border-radius: 10px;
	border: 1px solid rgba(255, 255, 255, 0.04)
}

main {
	display: flex;
	min-height: calc(100vh - 80px);
	align-items: center;
	justify-content: center;
	padding: 32px 0
}

.card {
	width: 420px;
	max-width: 96%;
	background: linear-gradient(180deg, rgba(255, 255, 255, 0.02),
		rgba(255, 255, 255, 0.01));
	border-radius: 14px;
	padding: 28px;
	border: 1px solid rgba(255, 255, 255, 0.04);
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35)
}

.card h1 {
	margin: 0 0 10px;
	font-size: 22px
}

.card p.sub {
	margin: 0 0 18px;
	color: var(--muted);
	font-size: 14px
}

label {
	display: block;
	font-size: 13px;
	color: var(--muted);
	margin-bottom: 6px
}

input[type="email"], input[type="password"] {
	width: 100%;
	padding: 12px 14px;
	border-radius: 10px;
	border: 1px solid rgba(255, 255, 255, 0.06);
	background: #0b1116;
	color: var(--text);
	margin-bottom: 14px;
	font-size: 15px;
}

.row {
	display: flex;
	gap: 12px;
	align-items: center
}

.remember {
	display: flex;
	align-items: center;
	gap: 8px;
	color: var(--muted);
	font-size: 14px;
	margin-bottom: 14px
}

.btn {
	display: inline-block;
	padding: 12px 16px;
	border-radius: 12px;
	background: var(--accent);
	color: #071014;
	font-weight: 700;
	text-align: center;
	border: 0;
	cursor: pointer;
	width: 100%;
}

.ghost {
	background: transparent;
	border: 1px solid rgba(255, 255, 255, 0.06);
	color: var(--text)
}

.divider {
	height: 1px;
	background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03),
		transparent);
	margin: 18px 0
}

.socials {
	display: flex;
	gap: 10px;
	justify-content: center
}

.social-btn {
	flex: 1;
	padding: 10px;
	border-radius: 10px;
	border: 1px solid rgba(255, 255, 255, 0.04);
	background: transparent;
	color: var(--text);
	cursor: pointer
}

.links {
	display: flex;
	justify-content: space-between;
	margin-top: 12px;
	font-size: 13px;
	color: var(--muted)
}

.small {
	font-size: 13px;
	color: var(--muted);
	margin-top: 10px;
	text-align: center
}

.error {
	color: #ffb4b4;
	background: rgba(255, 0, 0, 0.06);
	padding: 8px;
	border-radius: 8px;
	margin-bottom: 12px
}

.show-pass {
	font-size: 13px;
	color: var(--muted);
	cursor: pointer;
	background: transparent;
	border: 0
}

@media ( max-width :480px) {
	.card {
		padding: 20px
	}
	.logo {
		width: 32px;
		height: 32px
	}
}
</style>
</head>
<body>
	<div class="container">
		<header>
			<div class="brand">
				<a href="/" aria-label="Home"
					style="text-decoration: none; color: inherit; display: flex; gap: 10px; align-items: center">
					<div class="logo">D</div>
					<div>DoIt Club</div>
				</a>
			</div>
			<div class="nav-actions">
				<a href="/child/register.html" class="ghost">Sign up</a>
			</div>
		</header>

		<main>
			<div class="card" role="region" aria-labelledby="login-heading">
				<h1 id="login-heading">Welcome back</h1>
				<p class="sub">Sign in to continue — join clubs, find events,
					meet people.</p>

				<div id="error" class="error" style="display: none;"></div>

				<form id="loginForm" action="/api/login" method="post">
					<label for="email">Email</label> <input id="email" name="email"
						type="email" autocomplete="email" required
						placeholder="you@example.com"> <label for="password">Password</label>
					<div style="position: relative">
						<input id="password" name="password" type="password"
							autocomplete="current-password" required placeholder="••••••••">
						<button type="button" class="show-pass" aria-label="Show password"
							onclick="togglePassword()"
							style="position: absolute; right: 8px; top: 8px">Show</button>
					</div>

					<div class="remember">
						<input id="remember" name="remember" type="checkbox"> <label
							for="remember" style="margin: 0">Remember me</label>
					</div>

					<button type="submit" class="btn">Log in</button>

					<div class="divider"></div>

					<div class="socials">
						<button type="button" class="social-btn">Continue with
							Google</button>
						<button type="button" class="social-btn">Continue with
							Apple</button>
					</div>

					<div class="links">
						<a href="/forgot-password"
							style="color: var(--muted); text-decoration: none">Forgot
							password?</a> <a href="/child/register.html"
							style="color: var(--muted); text-decoration: none">Create
							account</a>
					</div>

					<div class="small">
						By logging in you agree to our <a href="/child/tnc/terms.html"
							style="color: var(--text);">Terms</a> & <a href="/child/tnc/privacy.html"
							style="color: var(--text);">Privacy</a>.
					</div>
				</form>
			</div>
		</main>
	</div>

	<script>
    function togglePassword(){
      const pw = document.getElementById('password');
      const btn = event.currentTarget || this;
      if(pw.type === 'password'){ pw.type = 'text'; btn.textContent = 'Hide'; }
      else { pw.type = 'password'; btn.textContent = 'Show'; }
    }

    // progressive JS: use fetch to submit & show errors; falls back to normal form POST if JS disabled
    document.getElementById('loginForm').addEventListener('submit', async function(e){
      if(!window.fetch) return; // let native submit happen
      e.preventDefault();
      const form = e.target;
      const data = {
        email: form.email.value.trim(),
        password: form.password.value,
        remember: form.remember.checked
      };

      const errorBox = document.getElementById('error');
      errorBox.style.display = 'none';

      try {
        const resp = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
          credentials: 'same-origin'
        });

        if(resp.ok){
          // on success redirect to home / dashboard
          window.location.href = '/';
        } else {
          const text = await resp.text().catch(()=>null) || 'Login failed';
          errorBox.textContent = text;
          errorBox.style.display = 'block';
        }
      } catch(err){
        errorBox.textContent = 'Network error — please try again';
        errorBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
